# XcodeGen spec: `xcodegen` turns this into Karaoke.xcodeproj (CI does it on every push).
# Bakes in the microphone permission, so a build can never ship without it.
name: Karaoke
options:
  bundleIdPrefix: com.karaoke
  deploymentTarget:
    iOS: "17.0"
targets:
  Karaoke:
    type: application
    platform: iOS
    sources:
      - path: ios
        excludes: [Info.plist]
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: Karaoke
        CFBundleShortVersionString: "1.0"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Sing along with live studio effects.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.karaoke.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
